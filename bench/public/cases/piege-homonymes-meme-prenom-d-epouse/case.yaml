note: 'Le baptême ne nomme la mère que « Marie » : le prénom de l''épouse ne départage pas les deux Jean
  MARTIN. Le parrain, aïeul maternel, est Louis PENHOAT : c''est l''entourage (FAN) qui désigne l''époux
  de Marie PENHOAT, et la mère est une relation déduite. La notation vérifie que les deux Jean restent
  deux personnes ; elle ne lit pas encore le père choisi (attendu : l''époux de Marie PENHOAT).'
