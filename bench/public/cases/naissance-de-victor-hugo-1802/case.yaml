note: "Un vrai acte, lu sur un fac-similé imprimé de la fin du XIXe siècle (Maison de Victor Hugo, CC0) : une copie, non le registre. L'acte est daté du 8 ventôse an X et dit l'enfant né « le jour d'hier » : la date attendue est le 7 ventôse an X, soit le 26 février 1802, que le moteur convertit (dates). Le projet de départ est la solution du cas deces-de-victor-hugo-1885 sans sa recherche : la personne y a déjà son décès prouvé, que le corpus exige."
