note: "Un vrai acte, celui du décès de Victor Hugo (Archives de Paris, 16e arrondissement, 1885, n° 546). L'acte est dressé le 23 mai et dit le décès survenu « hier au soir, à une heure et demie » : la date attendue est le 22 mai 1885, non celle de l'acte. Le projet de départ ne contient que l'image ; la solution la transcrit et cite les lignes 9 à 12."
