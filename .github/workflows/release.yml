name: release

# Publishes the wheel and the sdist by trusted publishing (no token is stored):
# - run by hand (workflow_dispatch): to TestPyPI, the trial before a release;
# - a tag v<version> pushed: to PyPI, once the tag is the version of src/probandia/__init__.py.
# The projects probandia on PyPI and TestPyPI, their trusted publisher (this repository, this file, the
# environment testpypi or pypi) and the two GitHub environments are created by the maintainer.
# The packages published are those tools/check_wheel.py built and checked (files, licences, metadata,
# no relative link in the description, no local note in the sdist, both installed and run).
# Actions are pinned by commit SHA; the comment names the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: The tag is the version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version="$(python -I run_probandia.py --version)"
          if [ "probandia ${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::the tag $GITHUB_REF_NAME is not the version ($version)"
            exit 1
          fi
      - name: Build, check and keep the wheel and the sdist
        run: python tools/check_wheel.py --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/probandia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/probandia
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
