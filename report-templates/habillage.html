/* ─── positive print: the light theme ─────────────────── */
/* on body, not :root: the <style> of a tree chart sets its own :root variables */
body{
  --paper:#E3E5E0;
  --panel:#F2F3F0;
  --ink:#191C1E;
  --ink-soft:#5C6467;
  --ink-faint:#8B9295;
  --rule:#B4BAB6;
  --rule-soft:#CDD2CE;
  --madder:#8E2B2B;
  --madder-soft:#B06A6A;
  --madder-wash:#F0E2E2;
  --note:var(--panel);
  --note-rule:var(--rule);
  --display:"Bodoni Moda","Bodoni 72",Didot,"Bodoni MT",Georgia,serif;
  --body:"Spectral",Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --goth:"Grenze Gotisch","Old English Text MT",Georgia,serif;
  --mono:"Probandia Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
/* ─── negative on film: the dark theme follows the system ── */
@media (prefers-color-scheme: dark){
  body{
    --paper:#15181A;
    --panel:#1D2124;
    --ink:#DEE2DF;
    --ink-soft:#9AA2A4;
    --ink-faint:#727A7C;
    --rule:#3A4144;
    --rule-soft:#2B3134;
    --madder:#CD8585;
    --madder-soft:#8E5050;
    --madder-wash:#2B1E1E;
  }
}

:root{color-scheme:light dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-weight:400;font-size:18px;line-height:1.68;
  font-feature-settings:"onum" 1;
}
article{max-width:940px;margin:0 auto;padding:0 28px 96px}

/* ─── masthead ─────────────────────────────────────────── */
.masthead{padding:88px 0 0}
.goth{
  font-family:var(--goth);font-weight:400;font-size:.95rem;
  letter-spacing:.13em;color:var(--ink-soft);line-height:1.2;margin:0 0 14px;
}
.masthead h1{
  font-family:var(--display);font-weight:700;
  font-size:clamp(2.3rem,6.6vw,4.5rem);line-height:1.02;margin:0;letter-spacing:-.018em;
  text-wrap:balance;
}
.byline{
  margin:44px 0 0;padding:16px 0 0;border-top:2.5px solid var(--ink);position:relative;
  font-family:var(--mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-soft);
}
