<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sign In to FamilySearch</title></head>
<body>
<header><a href="/">FamilySearch</a></header>
<main>
<h1>Sign In to FamilySearch</h1>
<form method="post" action="https://ident.familysearch.org/cis-web/oauth2/v3/authorization">
<label for="userName">Username</label><input id="userName" name="userName" type="text">
<label for="password">Password</label><input id="password" name="password" type="password">
<button type="submit">Sign In</button>
</form>
<p><a href="/register">Create Account</a> · <a href="/help">Forgot username or password?</a></p>
</main>
<!-- invented for the tests (3 October 2026): the shape of a sign-in screen, not a copy of the site -->
</body></html>
