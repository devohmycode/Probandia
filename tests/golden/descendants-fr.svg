<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 376 272" width="376" height="272" role="img" aria-label="Descendance de Nicolas HUGOT">
<style>
  :root { --record: #1d6b3a; --index: #2a5d9f; --hypothesis: #8a6100; --living: #666666;
    --ink: #1b1b1b; --paper: #ffffff; --line: #555555; }
  .box rect { fill: var(--paper); stroke-width: 1.5; }
  .record rect { stroke: var(--record); stroke-width: 2.5; }
  .index rect { stroke: var(--index); }
  .hypothesis rect { stroke: var(--hypothesis); stroke-dasharray: 5 4; }
  .living rect { stroke: var(--living); fill: #eeeeee; }
  text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .years { font-size: 11px; fill: #444444; }
  .link { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .link.hypothesis { stroke-dasharray: 4 4; }
</style>
<path class="link" d="M188,48 V80 H90 V112"/>
<path class="link" d="M90,160 V192 H90 V224"/>
<path class="link hypothesis" d="M188,48 V80 H286 V112"/>
<g class="box record" transform="translate(98,0)"><title>Nicolas HUGOT, ° 1850 † 1911</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Nicolas HUGOT</text><text class="years" x="8" y="38">° 1850 † 1911</text></g>
<g class="box record" transform="translate(0,112)"><title>Jean-Baptiste Joseph Anatole HUGOT, ° 1879 † 1960</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Jean-Baptiste Joseph Anat…</text><text class="years" x="8" y="38">° 1879 † 1960</text></g>
<g class="box hypothesis" transform="translate(196,112)"><title>Marthe HUGOT, ° 1882 † 1950</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Marthe HUGOT</text><text class="years" x="8" y="38">° 1882 † 1950</text></g>
<g class="box living" transform="translate(0,224)"><title>Personne vivante</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Personne vivante</text></g>
</svg>
