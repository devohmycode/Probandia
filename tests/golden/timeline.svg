<svg xmlns="http://www.w3.org/2000/svg" class="tl" viewBox="0 0 760 122" width="100%" style="max-width:760px;height:auto" role="img" aria-label="Timeline of Rose MARTIN">
<style>
  .tl { --record: #1d6b3a; --index: #2a5d9f; --hypothesis: #8a6100; --clash: #b00020; --ink: #1b1b1b;
    --paper: #ffffff; --line: #555555; }
  .tl text { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .tl .axis { stroke: var(--line); stroke-width: 1.5; }
  .tl .tick { stroke: var(--line); stroke-width: 1; }
  .tl .tick-label, .tl .kin { font-size: 11px; fill: #444444; }
  .tl .stem { stroke: #999999; stroke-width: 1; }
  .tl .mark { stroke-width: 2; }
  .tl .record .mark { fill: var(--record); stroke: var(--record); }
  .tl .index .mark { fill: var(--paper); stroke: var(--index); }
  .tl .hypothesis .mark { fill: var(--paper); stroke: var(--hypothesis); stroke-dasharray: 3 2; }
  .tl .clash .mark { fill: var(--paper); stroke: var(--clash); stroke-width: 3; stroke-dasharray: none; }
  .tl .clash text.sign { font-weight: bold; fill: var(--clash); }
  .tl .clash text.label { fill: var(--clash); font-weight: 600; }
  .tl .landmark { fill: #777777; }
</style>
<title>Timeline of Rose MARTIN</title>
<desc>birth 1820; marriage 1842; death 1890; mother death 1825; child birth 1845; spouse death 1860</desc>
<line class="axis" x1="36" y1="56" x2="724" y2="56"/>
<line class="tick" x1="65.9" y1="52" x2="65.9" y2="60"/><text class="tick-label" x="65.9" y="73" text-anchor="middle">1820</text>
<line class="tick" x1="155.7" y1="52" x2="155.7" y2="60"/><text class="tick-label" x="155.7" y="73" text-anchor="middle">1830</text>
<line class="tick" x1="245.4" y1="52" x2="245.4" y2="60"/><text class="tick-label" x="245.4" y="73" text-anchor="middle">1840</text>
<line class="tick" x1="335.1" y1="52" x2="335.1" y2="60"/><text class="tick-label" x="335.1" y="73" text-anchor="middle">1850</text>
<line class="tick" x1="424.9" y1="52" x2="424.9" y2="60"/><text class="tick-label" x="424.9" y="73" text-anchor="middle">1860</text>
<line class="tick" x1="514.6" y1="52" x2="514.6" y2="60"/><text class="tick-label" x="514.6" y="73" text-anchor="middle">1870</text>
<line class="tick" x1="604.3" y1="52" x2="604.3" y2="60"/><text class="tick-label" x="604.3" y="73" text-anchor="middle">1880</text>
<line class="tick" x1="694.1" y1="52" x2="694.1" y2="60"/><text class="tick-label" x="694.1" y="73" text-anchor="middle">1890</text>
<g class="record"><title>birth 1820</title><line class="stem" x1="65.9" y1="41" x2="65.9" y2="48"/><circle class="mark" cx="65.9" cy="56" r="6"/><text class="label" x="65.9" y="38" text-anchor="middle">birth 1820</text></g>
<g class="index"><title>marriage 1842</title><line class="stem" x1="263.4" y1="41" x2="263.4" y2="48"/><circle class="mark" cx="263.4" cy="56" r="6"/><text class="label" x="263.4" y="38" text-anchor="middle">marriage 1842</text></g>
<g class="hypothesis"><title>death 1890</title><line class="stem" x1="694.1" y1="41" x2="694.1" y2="48"/><circle class="mark" cx="694.1" cy="56" r="6"/><text class="label" x="694.1" y="38" text-anchor="middle">death 1890</text></g>
<g><title>mother death 1825 — Anne HUGOT</title><polygon class="landmark" points="110.8,80 114.8,87 106.8,87"/><text class="kin" x="110.8" y="102" text-anchor="middle">mother death 1825</text></g>
<g><title>child birth 1845 — Jean MARTIN</title><polygon class="landmark" points="290.3,80 294.3,87 286.3,87"/><text class="kin" x="290.3" y="102" text-anchor="middle">child birth 1845</text></g>
<g><title>spouse death 1860 — Paul ROY</title><polygon class="landmark" points="424.9,80 428.9,87 420.9,87"/><text class="kin" x="424.9" y="102" text-anchor="middle">spouse death 1860</text></g>
</svg>
