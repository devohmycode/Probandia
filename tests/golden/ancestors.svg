<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 224" width="620" height="224" role="img" aria-label="Ancestors of Victor HUGO">
<style>
  :root { --record: #1d6b3a; --index: #2a5d9f; --hypothesis: #8a6100; --living: #666666;
    --ink: #1b1b1b; --paper: #ffffff; --line: #555555; }
  .box rect { fill: var(--paper); stroke-width: 1.5; }
  .record rect { stroke: var(--record); stroke-width: 2.5; }
  .index rect { stroke: var(--index); }
  .hypothesis rect { stroke: var(--hypothesis); stroke-dasharray: 5 4; }
  .living rect { stroke: var(--living); fill: #eeeeee; }
  text { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--ink); }
  .years { font-size: 11px; fill: #444444; }
  .link { fill: none; stroke: var(--line); stroke-width: 1.2; }
  .link.hypothesis { stroke-dasharray: 4 4; }
</style>
<path class="link" d="M180,112 H200 V56 H220"/>
<path class="link" d="M180,112 H200 V168 H220"/>
<path class="link hypothesis" d="M400,56 H420 V28 H440"/>
<path class="link" d="M400,168 H420 V140 H440"/>
<g class="box record" transform="translate(0,88)"><title>Victor HUGO, ° 1802 x 1822 † 1885</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Victor HUGO</text><text class="years" x="8" y="38">° 1802 x 1822 † 1885</text></g>
<g class="box hypothesis" transform="translate(220,32)"><title>Léopold HUGO, ° 1773</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Léopold HUGO</text><text class="years" x="8" y="38">° 1773</text></g>
<g class="box index" transform="translate(220,144)"><title>Sophie TRÉBUCHET, ° 1772</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Sophie TRÉBUCHET</text><text class="years" x="8" y="38">° 1772</text></g>
<g class="box hypothesis" transform="translate(440,4)"><title>Joseph HUGO, † 1789</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Joseph HUGO</text><text class="years" x="8" y="38">† 1789</text></g>
<g class="box hypothesis" transform="translate(440,116)"><title>Jean-François TRÉBUCHET</title><rect width="180" height="48" rx="6"/><text x="8" y="20">Jean-François TRÉBUCHET</text></g>
</svg>
