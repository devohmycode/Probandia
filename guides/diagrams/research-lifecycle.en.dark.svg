<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="probandia-research-lifecycle-title probandia-research-lifecycle-desc" id="research-lifecycle-en-dark-root">
        <title id="probandia-research-lifecycle-title">Lifecycle of a Probandia research</title>
        <desc id="probandia-research-lifecycle-desc">A research created by new runs pass after pass: the open pass applies its proposals, then ends with pass end; resume opens the next one, a pass cut off is continued or closed, and close closes the research, which resume can reopen.</desc>
        <defs>
      <style>#research-lifecycle-en-dark-root { color-scheme: dark;
      --c-paper: #070606;
      --c-ink: #efe9dc;
      --c-muted: #989186;
      --c-soft: #7e786d;
      --c-card: #151413;
      --c-accent: #b59eff;
      --c-link: #80e3f5;
      --c-holo-1: #7fe3f5;
      --c-holo-2: #b49cff;
      --c-holo-3: #ff9fd8;
      --c-ink-02: rgba(239,233,220,0.02);
      --c-ink-05: rgba(239,233,220,0.05);
      --c-ink-08: rgba(239,233,220,0.08);
      --c-ink-10: rgba(239,233,220,0.10);
      --c-ink-40: rgba(239,233,220,0.40);
      --c-muted-10: rgba(152,145,134,0.10);
      --c-muted-50: rgba(152,145,134,0.50);
      --c-soft-40: rgba(126,120,109,0.40);
      --c-accent-08: rgba(181,158,255,0.10);
      --c-accent-50: rgba(181,158,255,0.50);
      --c-ink-06: rgba(239,233,220,0.06);
      --c-ink-20: rgba(239,233,220,0.20);
      --c-ink-22: rgba(239,233,220,0.22);
      --holo:          linear-gradient(120deg, var(--c-holo-1), var(--c-holo-2), var(--c-holo-3));
      --font-sans:     system-ui, -apple-system, "Segoe UI", ui-sans-serif, sans-serif;
      --font-mono:     "JetBrains Mono", ui-monospace, monospace; }
      #research-lifecycle-en-dark-root { font-family: var(--font-sans); color: var(--c-ink); }
      #research-lifecycle-en-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #research-lifecycle-en-dark-root .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
      #research-lifecycle-en-dark-root .theme-toggle { font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--c-ink);
      background: var(--c-card);
      border: 1px solid var(--c-ink-10);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      white-space: nowrap; }
      #research-lifecycle-en-dark-root .theme-toggle:hover { border-color: var(--c-accent); }
      #research-lifecycle-en-dark-root .theme-switch { position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      #research-lifecycle-en-dark-root .theme-switch:focus-visible + .theme-toggle { outline: 2px solid var(--c-accent); outline-offset: 2px; }</style>
          <pattern id="research-lifecycle-en-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" style="fill:var(--c-ink-08)"/>
          </pattern>
          <marker id="research-lifecycle-en-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--c-muted)"/></marker>
          <marker id="research-lifecycle-en-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--c-accent)"/></marker>
        </defs>

        <rect width="100%" height="100%" style="fill:var(--c-paper)"/>
        <rect width="100%" height="100%" fill="url(#research-lifecycle-en-dark-dots)" opacity="0.55"/>

        <!-- Bands -->
        <rect x="24" y="48" width="1232" height="136" rx="8" stroke-width="0.8" style="fill:var(--c-ink-02);stroke:var(--c-ink-10)"/>
        <rect x="24" y="432" width="1232" height="136" rx="8" stroke-width="0.8" style="fill:var(--c-ink-02);stroke:var(--c-ink-10)"/>
        <g font-family="'JetBrains Mono', monospace" font-size="11" letter-spacing="0.14em" style="fill:var(--c-soft)">
          <text x="40" y="68">WAIT / RECOVERY</text>
          <text x="40" y="236">PHASES</text>
          <text x="40" y="452">OUTCOME</text>
        </g>

        <!-- Ten labeled transitions, drawn before states -->
        <line x1="54" y1="284" x2="88" y2="284" stroke-width="1.2" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="280" y1="284" x2="384" y2="284" stroke-width="1.2" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="576" y1="284" x2="680" y2="284" stroke-width="1.2" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="872" y1="284" x2="976" y2="284" stroke-width="1.2" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <!-- next pass: under the rail, back into Passe ouverte -->
        <path d="M 1040,320 V 376 Q 1040,384 1032,384 H 520 Q 512,384 512,376 V 320"
              fill="none" stroke-width="1.2" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <!-- interruption and its two ways out -->
        <line x1="448" y1="248" x2="448" y2="160" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="512" y1="160" x2="512" y2="248" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <path d="M 576,124 H 1032 Q 1040,124 1040,132 V 248"
              fill="none" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <!-- close, and resume reopening a closed research -->
        <line x1="1104" y1="320" x2="1104" y2="472" stroke-width="1.4" marker-end="url(#research-lifecycle-en-dark-arrow-accent)" style="stroke:var(--c-accent)"/>
        <path d="M 976,508 H 456 Q 448,508 448,500 V 320"
              fill="none" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>

        <!-- Transition labels -->
        <g font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="0.08em">
          <rect x="48" y="260" width="40" height="16" rx="2" style="fill:var(--c-paper)"/><text x="68" y="272" style="fill:var(--c-muted)">NEW</text>
          <rect x="298" y="260" width="68" height="16" rx="2" style="fill:var(--c-paper)"/><text x="332" y="272" style="fill:var(--c-muted)">PASS 1</text>
          <rect x="600" y="260" width="56" height="16" rx="2" style="fill:var(--c-paper)"/><text x="628" y="272" style="fill:var(--c-muted)">APPLY</text>
          <rect x="886" y="260" width="76" height="16" rx="2" style="fill:var(--c-paper)"/><text x="924" y="272" style="fill:var(--c-muted)">PASS END</text>
          <rect x="744" y="388" width="64" height="16" rx="2" style="fill:var(--c-paper)"/><text x="776" y="400" style="fill:var(--c-muted)">RESUME</text>
          <rect x="372" y="194" width="68" height="16" rx="2" style="fill:var(--c-paper)"/><text x="406" y="206" style="fill:var(--c-muted)">CUT OFF</text>
          <rect x="520" y="194" width="76" height="16" rx="2" style="fill:var(--c-paper)"/><text x="558" y="206" style="fill:var(--c-muted)">CONTINUE</text>
          <rect x="750" y="100" width="116" height="16" rx="2" style="fill:var(--c-paper)"/><text x="808" y="112" style="fill:var(--c-muted)">ENDS THE PASS</text>
          <rect x="1112" y="386" width="56" height="16" rx="2" style="fill:var(--c-paper)"/><text x="1140" y="398" style="fill:var(--c-accent)">CLOSE</text>
          <rect x="674" y="484" width="68" height="16" rx="2" style="fill:var(--c-paper)"/><text x="708" y="496" style="fill:var(--c-muted)">REOPENS</text>
        </g>

        <!-- Start pseudo-state -->
        <circle cx="48" cy="284" r="6" style="fill:var(--c-ink)"/>

        <!-- Primary rail: four phases -->
        <g text-anchor="middle">
          <rect x="88" y="248" width="192" height="72" rx="8" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <text x="184" y="280" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-ink)">New</text>
          <text x="184" y="298" font-size="11" font-family="'JetBrains Mono', monospace" style="fill:var(--c-muted)">family · questions</text>

          <rect x="384" y="248" width="192" height="72" rx="8" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <text x="480" y="280" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-ink)">Pass open</text>
          <text x="480" y="298" font-size="11" font-family="'JetBrains Mono', monospace" style="fill:var(--c-muted)">lock · plan · search</text>

          <rect x="680" y="248" width="192" height="72" rx="8" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <text x="776" y="280" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-ink)">Evidence applied</text>
          <text x="776" y="298" font-size="11" font-family="'JetBrains Mono', monospace" style="fill:var(--c-muted)">none pending</text>

          <rect x="976" y="248" width="192" height="72" rx="8" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <text x="1072" y="280" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-ink)">Pass ended</text>
          <text x="1072" y="298" font-size="11" font-family="'JetBrains Mono', monospace" style="fill:var(--c-muted)">rendered · verify OK</text>
        </g>

        <!-- Wait / recovery state -->
        <g text-anchor="middle">
          <rect x="384" y="88" width="192" height="72" rx="8" stroke-width="1" stroke-dasharray="5,4" style="fill:var(--c-paper);stroke:var(--c-muted)"/>
          <rect x="392" y="96" width="72" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-muted-50)"/>
          <text x="428" y="108" font-size="11" font-family="'JetBrains Mono', monospace" letter-spacing="0.08em" style="fill:var(--c-muted)">RECOVERY</text>
          <text x="480" y="128" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-ink)">Pass interrupted</text>
          <text x="480" y="146" font-size="11" font-family="'JetBrains Mono', monospace" style="fill:var(--c-muted)">resume asks what to do</text>
        </g>

        <!-- Terminal outcome -->
        <g text-anchor="middle">
          <rect x="976" y="472" width="192" height="72" rx="8" stroke-width="1" style="fill:var(--c-accent-08);stroke:var(--c-accent)"/>
          <circle cx="1000" cy="496" r="7" fill="none" stroke-width="1" style="stroke:var(--c-accent)"/>
          <circle cx="1000" cy="496" r="4" style="fill:var(--c-accent)"/>
          <text x="1072" y="504" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-ink)">Closed</text>
          <text x="1072" y="522" font-size="11" font-family="'JetBrains Mono', monospace" style="fill:var(--c-muted)">questions settled</text>
        </g>

        <!-- Legend strip -->
        <line x1="40" y1="608" x2="1240" y2="608" stroke-width="0.8" style="stroke:var(--c-ink-10)"/>
        <text x="40" y="628" font-size="11" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" style="fill:var(--c-muted)">LEGEND</text>
        <circle cx="47" cy="649" r="5" style="fill:var(--c-ink)"/>
        <text x="60" y="652" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Start</text>
        <rect x="112" y="644" width="14" height="10" rx="2" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
        <text x="132" y="652" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Phase</text>
        <rect x="180" y="644" width="14" height="10" rx="2" stroke-width="1" stroke-dasharray="3,2" style="fill:var(--c-paper);stroke:var(--c-muted)"/>
        <text x="200" y="652" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Wait</text>
        <rect x="260" y="644" width="14" height="10" rx="2" stroke-width="1" style="fill:var(--c-accent-08);stroke:var(--c-accent)"/>
        <text x="280" y="652" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Outcome</text>
        <line x1="328" y1="650" x2="356" y2="650" stroke-width="1.2" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <text x="364" y="652" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Command</text>
        <line x1="440" y1="650" x2="468" y2="650" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#research-lifecycle-en-dark-arrow)" style="stroke:var(--c-muted)"/>
        <text x="476" y="652" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Interruption or recovery</text>
        <line x1="620" y1="650" x2="648" y2="650" stroke-width="1.4" marker-end="url(#research-lifecycle-en-dark-arrow-accent)" style="stroke:var(--c-accent)"/>
        <text x="656" y="652" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Closing</text>
      </svg>
