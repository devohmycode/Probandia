<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="probandia-pass-sequence-title probandia-pass-sequence-desc" id="pass-sequence-fr-root">
        <title id="probandia-pass-sequence-title">Une passe de recherche Probandia</title>
        <desc id="probandia-pass-sequence-desc">La session ouvre la passe et confie un brief à l'orchestrateur ; à chaque vague, les agents de terrain cherchent, lisent et proposent, le reader transcrit les vues d'un registre ; seul l'orchestrateur applique les propositions puis termine la passe.</desc>
        <defs>
      <style>#pass-sequence-fr-root { color-scheme: light;
      --c-paper: #f2ede3;
      --c-ink: #1a1714;
      --c-muted: #59544a;
      --c-soft: #5f5a50;
      --c-card: #faf7f0;
      --c-accent: #5132cd;
      --c-link: #096d81;
      --c-holo-1: #0a7a90;
      --c-holo-2: #5a3fd0;
      --c-holo-3: #b02f7b;
      --c-ink-02: rgba(26,23,20,0.02);
      --c-ink-05: rgba(26,23,20,0.05);
      --c-ink-08: rgba(26,23,20,0.08);
      --c-ink-10: rgba(26,23,20,0.10);
      --c-ink-40: rgba(26,23,20,0.40);
      --c-muted-10: rgba(89,84,74,0.10);
      --c-muted-50: rgba(89,84,74,0.50);
      --c-soft-40: rgba(95,90,80,0.40);
      --c-accent-08: rgba(81,50,205,0.08);
      --c-accent-50: rgba(81,50,205,0.50);
      --c-ink-06: rgba(26,23,20,0.06);
      --c-ink-20: rgba(26,23,20,0.20);
      --c-ink-22: rgba(26,23,20,0.22);
      --holo:          linear-gradient(120deg, var(--c-holo-1), var(--c-holo-2), var(--c-holo-3));
      --font-sans:     system-ui, -apple-system, "Segoe UI", ui-sans-serif, sans-serif;
      --font-mono:     "JetBrains Mono", ui-monospace, monospace; }
      #pass-sequence-fr-root { font-family: var(--font-sans); color: var(--c-ink); }
      #pass-sequence-fr-root .diagram-container { width: 100%; overflow-x: auto; }
      #pass-sequence-fr-root .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
      #pass-sequence-fr-root .theme-toggle { font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--c-ink);
      background: var(--c-card);
      border: 1px solid var(--c-ink-10);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      white-space: nowrap; }
      #pass-sequence-fr-root .theme-toggle:hover { border-color: var(--c-accent); }
      #pass-sequence-fr-root .theme-switch { position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      #pass-sequence-fr-root .theme-switch:focus-visible + .theme-toggle { outline: 2px solid var(--c-accent); outline-offset: 2px; }</style>
          <pattern id="pass-sequence-fr-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" style="fill:var(--c-ink-08)"/>
          </pattern>
          <linearGradient id="pass-sequence-fr-holo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color:var(--c-holo-1)"/>
            <stop offset="0.5" style="stop-color:var(--c-holo-2)"/>
            <stop offset="1" style="stop-color:var(--c-holo-3)"/>
          </linearGradient>
          <marker id="pass-sequence-fr-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--c-muted)"/></marker>
          <marker id="pass-sequence-fr-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--c-accent)"/></marker>
        </defs>

        <rect width="100%" height="100%" style="fill:var(--c-paper)"/>
        <rect width="100%" height="100%" fill="url(#pass-sequence-fr-dots)" opacity="0.55"/>

        <!-- Lifelines -->
        <line x1="136" y1="96" x2="136" y2="616" stroke-width="1" stroke-dasharray="3,3" style="stroke:var(--c-ink-20)"/>
        <line x1="384" y1="96" x2="384" y2="616" stroke-width="1" stroke-dasharray="3,3" style="stroke:var(--c-ink-20)"/>
        <line x1="632" y1="96" x2="632" y2="616" stroke-width="1" stroke-dasharray="3,3" style="stroke:var(--c-ink-20)"/>
        <line x1="880" y1="96" x2="880" y2="616" stroke-width="1" stroke-dasharray="3,3" style="stroke:var(--c-ink-20)"/>
        <line x1="1128" y1="96" x2="1128" y2="616" stroke-width="1" stroke-dasharray="3,3" style="stroke:var(--c-ink-20)"/>

        <!-- Loop fragment: one wave of field agents -->
        <rect x="356" y="228" width="800" height="260" rx="4" stroke-width="1" style="fill:var(--c-ink-02);stroke:var(--c-ink-22)"/>
        <rect x="356" y="228" width="48" height="16" rx="2" stroke-width="1" style="fill:var(--c-paper);stroke:var(--c-ink-22)"/>
        <text x="380" y="241" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" letter-spacing="0.12em" style="fill:var(--c-muted)">LOOP</text>
        <text x="412" y="241" font-size="11" font-family="'JetBrains Mono', monospace" letter-spacing="0.04em" style="fill:var(--c-muted)">[par vague]</text>

        <!-- Activation bars -->
        <rect x="132" y="132" width="8" height="464" stroke-width="0.8" style="fill:var(--c-ink-06);stroke:var(--c-muted)"/>
        <rect x="380" y="168" width="8" height="428" stroke-width="0.8" style="fill:var(--c-ink-06);stroke:var(--c-muted)"/>
        <rect x="628" y="280" width="8" height="108" stroke-width="0.8" style="fill:var(--c-ink-06);stroke:var(--c-muted)"/>
        <rect x="876" y="424" width="8" height="36" stroke-width="0.8" style="fill:var(--c-ink-06);stroke:var(--c-muted)"/>

        <!-- Messages, top to bottom -->
        <line x1="140" y1="132" x2="1128" y2="132" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="140" y1="168" x2="380" y2="168" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="388" y1="204" x2="1128" y2="204" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="388" y1="280" x2="628" y2="280" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="636" y1="316" x2="1128" y2="316" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="636" y1="352" x2="1128" y2="352" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="628" y1="388" x2="388" y2="388" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="388" y1="424" x2="876" y2="424" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="876" y1="460" x2="388" y2="460" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="388" y1="524" x2="1128" y2="524" stroke-width="1.4" marker-end="url(#pass-sequence-fr-arrow-accent)" style="stroke:var(--c-accent)"/>
        <line x1="388" y1="560" x2="1128" y2="560" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="380" y1="596" x2="140" y2="596" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>

        <!-- Message labels: masked, 8px above their line -->
        <g font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="0.08em">
          <rect x="228" y="108" width="64" height="16" rx="2" style="fill:var(--c-paper)"/><text x="260" y="120" style="fill:var(--c-muted)">RESUME</text>
          <rect x="232" y="144" width="56" height="16" rx="2" style="fill:var(--c-paper)"/><text x="260" y="156" style="fill:var(--c-muted)">BRIEF</text>
          <rect x="454" y="180" width="108" height="16" rx="2" style="fill:var(--c-paper)"/><text x="508" y="192" style="fill:var(--c-muted)">KNOWN · PLAN</text>
          <rect x="454" y="256" width="108" height="16" rx="2" style="fill:var(--c-paper)"/><text x="508" y="268" style="fill:var(--c-muted)">TÂCHE FERMÉE</text>
          <rect x="698" y="292" width="116" height="16" rx="2" style="fill:var(--c-paper)"/><text x="756" y="304" style="fill:var(--c-muted)">SEARCH · READ</text>
          <rect x="722" y="328" width="68" height="16" rx="2" style="fill:var(--c-paper)"/><text x="756" y="340" style="fill:var(--c-muted)">PROPOSE</text>
          <rect x="476" y="364" width="64" height="16" rx="2" style="fill:var(--c-paper)"/><text x="508" y="376" style="fill:var(--c-muted)">RETOUR</text>
          <rect x="450" y="400" width="116" height="16" rx="2" style="fill:var(--c-paper)"/><text x="508" y="412" style="fill:var(--c-muted)">VUES REGISTRE</text>
          <rect x="698" y="436" width="116" height="16" rx="2" style="fill:var(--c-paper)"/><text x="756" y="448" style="fill:var(--c-muted)">TRANSCRIPTION</text>
          <rect x="480" y="500" width="56" height="16" rx="2" style="fill:var(--c-paper)"/><text x="508" y="512" style="fill:var(--c-accent)">APPLY</text>
          <rect x="470" y="536" width="76" height="16" rx="2" style="fill:var(--c-paper)"/><text x="508" y="548" style="fill:var(--c-muted)">PASS END</text>
          <rect x="232" y="572" width="56" height="16" rx="2" style="fill:var(--c-paper)"/><text x="260" y="584" style="fill:var(--c-muted)">BILAN</text>
        </g>

        <!-- Callout -->
        <text x="1128" y="600" font-size="11" font-style="italic" font-family="'JetBrains Mono', monospace" text-anchor="end" style="fill:var(--c-soft)">les agents proposent, seul l'orchestrateur applique</text>

        <!-- Actors (drawn last, over the lifeline tops) -->
        <rect x="48" y="40" width="176" height="56" rx="6" style="fill:var(--c-paper)"/>
        <rect x="48" y="40" width="176" height="56" rx="6" stroke-width="1" style="fill:var(--c-muted-10);stroke:var(--c-soft)"/>
        <text x="136" y="64" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" style="fill:var(--c-ink)">Session</text>
        <text x="136" y="80" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">agent principal</text>

        <rect x="296" y="40" width="176" height="56" rx="6" style="fill:var(--c-paper)"/>
        <rect x="296" y="40" width="176" height="56" rx="6" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
        <text x="384" y="64" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" style="fill:var(--c-ink)">Orchestrateur</text>
        <text x="384" y="80" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">planifie · applique</text>

        <rect x="544" y="40" width="176" height="56" rx="6" style="fill:var(--c-paper)"/>
        <rect x="544" y="40" width="176" height="56" rx="6" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
        <text x="632" y="64" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" style="fill:var(--c-ink)">Agents de terrain</text>
        <text x="632" y="80" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">researcher · searcher</text>

        <rect x="792" y="40" width="176" height="56" rx="6" style="fill:var(--c-paper)"/>
        <rect x="792" y="40" width="176" height="56" rx="6" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
        <text x="880" y="64" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" style="fill:var(--c-ink)">Reader</text>
        <text x="880" y="80" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">lit les vues d'un acte</text>

        <rect x="1040" y="40" width="176" height="56" rx="6" style="fill:var(--c-paper)"/>
        <rect x="1040" y="40" width="176" height="56" rx="6" stroke="url(#pass-sequence-fr-holo)" stroke-width="1.6" style="fill:var(--c-accent-08)"/>
        <text x="1128" y="64" font-size="12" font-weight="600" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" style="fill:var(--c-ink)">Moteur</text>
        <text x="1128" y="80" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">probandia · contrat</text>

        <!-- Legend strip -->
        <line x1="40" y1="640" x2="1240" y2="640" stroke-width="0.8" style="stroke:var(--c-ink-10)"/>
        <text x="40" y="660" font-size="11" font-family="'JetBrains Mono', monospace" letter-spacing="0.14em" style="fill:var(--c-muted)">LÉGENDE</text>
        <line x1="40" y1="682" x2="68" y2="682" stroke-width="1.2" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <text x="76" y="685" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Appel</text>
        <line x1="152" y1="682" x2="180" y2="682" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#pass-sequence-fr-arrow)" style="stroke:var(--c-muted)"/>
        <text x="188" y="685" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Retour</text>
        <line x1="264" y1="682" x2="292" y2="682" stroke-width="1.4" marker-end="url(#pass-sequence-fr-arrow-accent)" style="stroke:var(--c-accent)"/>
        <text x="300" y="685" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Écriture dans les données</text>
        <rect x="464" y="677" width="8" height="12" stroke-width="0.8" style="fill:var(--c-ink-06);stroke:var(--c-muted)"/>
        <text x="480" y="685" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Acteur actif</text>
        <rect x="572" y="677" width="14" height="10" rx="2" stroke="url(#pass-sequence-fr-holo)" stroke-width="1.2" style="fill:var(--c-accent-08)"/>
        <text x="592" y="685" font-size="11" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" style="fill:var(--c-muted)">Moteur</text>
      </svg>
