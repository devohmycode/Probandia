          <text x="1132" y="340" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">providers · quotas</text>

          <rect x="1032" y="488" width="200" height="72" rx="6" style="fill:var(--c-paper)"/>
          <rect x="1032" y="488" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--c-muted-10);stroke:var(--c-soft)"/>
          <rect x="1040" y="496" width="36" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-soft-40)"/>
