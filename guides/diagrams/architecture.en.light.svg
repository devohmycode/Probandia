        <text x="584" y="176" font-size="11" font-family="'JetBrains Mono', monospace"
              text-anchor="middle" letter-spacing="0.1em" style="fill:var(--c-soft)">ENTRY POINTS</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="208" y1="316" x2="264" y2="316" stroke-width="1.2" marker-end="url(#architecture-en-arrow)" style="stroke:var(--c-muted)"/>
        <path d="M 440,304 H 460 Q 468,304 468,296 V 244 Q 468,236 476,236 H 496"
              fill="none" stroke-width="1.2" marker-end="url(#architecture-en-arrow)" style="stroke:var(--c-muted)"/>
        <path d="M 440,328 H 460 Q 468,328 468,336 V 388 Q 468,396 476,396 H 496"
              fill="none" stroke-width="1.2" marker-end="url(#architecture-en-arrow)" style="stroke:var(--c-muted)"/>
        <path d="M 672,236 H 700 Q 708,236 708,244 V 296 Q 708,304 716,304 H 744"
              fill="none" stroke-width="1.4" marker-end="url(#architecture-en-arrow-accent)" style="stroke:var(--c-accent)"/>
        <path d="M 672,396 H 700 Q 708,396 708,388 V 336 Q 708,328 716,328 H 744"
              fill="none" stroke-width="1.2" marker-end="url(#architecture-en-arrow)" style="stroke:var(--c-muted)"/>
        <path d="M 840,280 V 164 Q 840,156 848,156 H 1032"
              fill="none" stroke-width="1.2" marker-end="url(#architecture-en-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="936" y1="316" x2="1032" y2="316" stroke-width="1.2" marker-end="url(#architecture-en-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="840" y1="352" x2="840" y2="488" stroke-width="1.2" marker-end="url(#architecture-en-arrow)" style="stroke:var(--c-muted)"/>
        <line x1="1132" y1="352" x2="1132" y2="488" stroke-width="1.2" marker-end="url(#architecture-en-arrow-link)" style="stroke:var(--c-link)"/>

        <!-- Arrow labels, 11px, masked -->
        <g font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" letter-spacing="0.06em">
          <rect x="892" y="132" width="96" height="16" rx="2" style="fill:var(--c-paper)"/><text x="940" y="144" style="fill:var(--c-muted)">READ · WRITE</text>
          <rect x="952" y="292" width="64" height="16" rx="2" style="fill:var(--c-paper)"/><text x="984" y="304" style="fill:var(--c-muted)">SEARCH</text>
          <rect x="848" y="412" width="52" height="16" rx="2" style="fill:var(--c-paper)"/><text x="874" y="424" style="fill:var(--c-muted)">RENDER</text>
          <rect x="1140" y="412" width="48" height="16" rx="2" style="fill:var(--c-paper)"/><text x="1164" y="424" style="fill:var(--c-link)">HTTPS</text>
        </g>

