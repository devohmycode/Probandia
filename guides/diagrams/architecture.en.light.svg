        <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
          <rect x="40" y="280" width="168" height="72" rx="6" style="fill:var(--c-paper)"/>
          <rect x="40" y="280" width="168" height="72" rx="6" stroke-width="1" style="fill:var(--c-muted-10);stroke:var(--c-soft)"/>
          <rect x="48" y="288" width="36" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-soft-40)"/>
          <text x="66" y="300" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-soft)">EXT</text>
          <text x="124" y="322" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">Coding agent</text>
          <text x="124" y="340" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">Claude · Codex · Cursor</text>

          <rect x="264" y="280" width="176" height="72" rx="6" style="fill:var(--c-paper)"/>
          <rect x="264" y="280" width="176" height="72" rx="6" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <rect x="272" y="288" width="56" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-ink-40)"/>
          <text x="300" y="300" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-ink)">PLUGIN</text>
          <text x="352" y="322" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">Plugin surface</text>
          <text x="352" y="340" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">agents · skills · hooks</text>

          <rect x="496" y="200" width="176" height="72" rx="6" style="fill:var(--c-paper)"/>
          <rect x="496" y="200" width="176" height="72" rx="6" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <rect x="504" y="208" width="36" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-ink-40)"/>
