<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="probandia-architecture-title probandia-architecture-desc" id="architecture-en-root">
        <title id="probandia-architecture-title">Probandia architecture</title>
        <desc id="probandia-architecture-desc">The coding agent loads the Probandia plugin, which calls the GPS proof engine through the CLI or the MCP server; the engine reads and writes the project, queries online archives through its providers and renders the report.</desc>
        <defs>
      <style>#architecture-en-root { color-scheme: light;
      --c-paper: #f2ede3;
      --c-ink: #1a1714;
      --c-muted: #59544a;
      --c-soft: #5f5a50;
      --c-card: #faf7f0;
      --c-accent: #5132cd;
      --c-link: #096d81;
      --c-holo-1: #0a7a90;
      --c-holo-2: #5a3fd0;
      --c-holo-3: #b02f7b;
      --c-ink-02: rgba(26,23,20,0.02);
      --c-ink-05: rgba(26,23,20,0.05);
      --c-ink-08: rgba(26,23,20,0.08);
      --c-ink-10: rgba(26,23,20,0.10);
      --c-ink-40: rgba(26,23,20,0.40);
      --c-muted-10: rgba(89,84,74,0.10);
      --c-muted-50: rgba(89,84,74,0.50);
      --c-soft-40: rgba(95,90,80,0.40);
      --c-accent-08: rgba(81,50,205,0.08);
      --c-accent-50: rgba(81,50,205,0.50);
      --c-ink-06: rgba(26,23,20,0.06);
      --c-ink-20: rgba(26,23,20,0.20);
      --c-ink-22: rgba(26,23,20,0.22);
      --holo:          linear-gradient(120deg, var(--c-holo-1), var(--c-holo-2), var(--c-holo-3));
      --font-sans:     system-ui, -apple-system, "Segoe UI", ui-sans-serif, sans-serif;
      --font-mono:     "JetBrains Mono", ui-monospace, monospace; }
      #architecture-en-root { font-family: var(--font-sans); color: var(--c-ink); }
      #architecture-en-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-en-root .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
      #architecture-en-root .theme-toggle { font-family: var(--font-mono);
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      color: var(--c-ink);
      background: var(--c-card);
      border: 1px solid var(--c-ink-10);
      border-radius: 6px;
      padding: 0.45rem 0.75rem;
      cursor: pointer;
      white-space: nowrap; }
      #architecture-en-root .theme-toggle:hover { border-color: var(--c-accent); }
      #architecture-en-root .theme-switch { position: absolute; width: 1px; height: 1px; margin: -1px;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
      #architecture-en-root .theme-switch:focus-visible + .theme-toggle { outline: 2px solid var(--c-accent); outline-offset: 2px; }</style>
          <pattern id="architecture-en-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" style="fill:var(--c-ink-08)"/>
          </pattern>
          <linearGradient id="architecture-en-holo" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" style="stop-color:var(--c-holo-1)"/>
            <stop offset="0.5" style="stop-color:var(--c-holo-2)"/>
            <stop offset="1" style="stop-color:var(--c-holo-3)"/>
          </linearGradient>
          <marker id="architecture-en-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--c-muted)"/></marker>
          <marker id="architecture-en-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--c-accent)"/></marker>
          <marker id="architecture-en-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--c-link)"/></marker>
        </defs>

        <rect width="100%" height="100%" style="fill:var(--c-paper)"/>
        <rect width="100%" height="100%" fill="url(#architecture-en-dots)" opacity="0.55"/>

        <!-- Zone: entry points -->
