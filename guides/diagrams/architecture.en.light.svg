          <rect x="744" y="280" width="192" height="72" rx="6" stroke="url(#architecture-en-holo)" stroke-width="1.6" style="fill:var(--c-accent-08)"/>
          <rect x="752" y="288" width="56" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-accent-50)"/>
          <text x="780" y="300" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-accent)">ENGINE</text>
          <text x="840" y="322" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">GPS proof engine</text>
          <text x="840" y="340" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">proof · verify · research</text>

          <rect x="744" y="488" width="192" height="72" rx="6" style="fill:var(--c-paper)"/>
          <rect x="744" y="488" width="192" height="72" rx="6" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <rect x="752" y="496" width="44" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-ink-40)"/>
          <text x="774" y="508" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-ink)">HTML</text>
          <text x="840" y="530" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">Report</text>
          <text x="840" y="548" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">report-templates/</text>

          <rect x="1032" y="120" width="200" height="72" rx="6" style="fill:var(--c-paper)"/>
          <rect x="1032" y="120" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--c-ink-05);stroke:var(--c-muted)"/>
          <rect x="1040" y="128" width="48" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-muted-50)"/>
