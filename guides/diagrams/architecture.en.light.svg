          <text x="1132" y="530" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">Online archives</text>
          <text x="1132" y="548" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">civil and parish records</text>
