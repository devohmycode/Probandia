          <text x="1132" y="162" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">Research project</text>
          <text x="1132" y="180" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">probandia.toml · families/</text>

