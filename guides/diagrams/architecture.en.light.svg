          <text x="584" y="242" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">probandia command</text>
          <text x="584" y="260" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">contract KEY=value · JSON</text>

          <rect x="496" y="360" width="176" height="72" rx="6" style="fill:var(--c-paper)"/>
          <rect x="496" y="360" width="176" height="72" rx="6" stroke-width="1" style="fill:var(--c-card);stroke:var(--c-ink)"/>
          <rect x="504" y="368" width="36" height="16" rx="2" fill="none" stroke-width="0.8" style="stroke:var(--c-ink-40)"/>
          <text x="522" y="380" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-ink)">MCP</text>
          <text x="584" y="402" font-size="12" font-weight="600" text-anchor="middle" style="fill:var(--c-ink)">MCP server</text>
          <text x="584" y="420" font-size="11" font-family="'JetBrains Mono', monospace" text-anchor="middle" style="fill:var(--c-muted)">stdio · probandia mcp</text>

