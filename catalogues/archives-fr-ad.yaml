      - "The registers of a commune: archive run ad50.registers --args '{\"commune\": \"<Commune>\", \"type\": \"<birth, marriage, death or decennial_tables>\", \"from\": <year>, \"to\": <year>}' — cote, act types, years and detail of each."
      - "Decennial tables first (\"type\": \"decennial_tables\"), then the register of the year."
      - "The act: ad50.sheet, \"from\" and \"to\": ten views' top bands; ad50.view, \"view\" and \"size\": 900: the view small; the same call with \"region\": \"x,y,w,h\" as seen on it: the act alone, at full size. No \"view\": the number of views."
      - "In a browser: https://www.archives-manche.fr/recherche/registres-paroissiaux-et-detat-civil?detail=<detail> shows the register; never pose as a browser elsewhere."
