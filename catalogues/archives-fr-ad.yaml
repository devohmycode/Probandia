      - "The session of that tab is needed: a request without its cookie gets 403. Never curl."
      - "One view: https://archives.hauts-de-seine.fr/cgi-bin/iipsrv.fcgi?FIF=<path>&HEI=800&QLT=80&CVT=JPG; a zoom: &WID=1450&RGN=<x>,<y>,<w>,<h> in fractions of the page."
      - "The path of a view of marriages, as seen for one commune: FIF=/home/httpd/ad92/diffusion/prod/app//webroot/data/files/ad92.diffusion/images/ACTES7/<COMMUNE>/MARIAGES/1E_NUM_<COMMUNE>_M<YEAR>/FRAD_092_4E_<COMMUNE>_<register>_<view>.JPG"
