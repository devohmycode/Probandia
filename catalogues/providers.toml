# Free tiers of the providers Probandia may use. Nothing here is ever paid for.
# Values checked on 2026-10-23 (T217); entries marked "to confirm" are re-read when an
# account is opened. `doctor` warns when a `checked` date is more than 90 days old.
#
# family: G | B | Br | E | M | Ma | X | P | Px | opaque — keyword: may count for a negative
# free.period: monthly | daily | once — free.reset: billing | utc-midnight | 1-28
# free.expires_months: a one-off tier that expires, counted from the first use
# quota: the id of the entry whose quota this one draws on (same account)
# introspection.method: endpoint | headers | response | none
# cache_ttl: seconds; absent: the cache.days setting; 0: the current pass only
#
# costs: units per operation (search, read, map, crawl, extract). Reading tiers, cheapest first:
#   read, then read_js (scripts rendered or awaited). The reader goes one tier up
#   only when the page came back unrendered; a tier not priced costs the one below.
#   Anti-bot tiers (premium or residential proxy, stealth, CAPTCHA) are never used.
#   map, crawl and extract are priced per call, except those listed in per_page:
#   a price per URL returned (map) or per page read (crawl).
# mcp_tools: the tools of the provider's own MCP server, each with the operation of
#   `costs` it makes (T49): the hooks know a server named by a UUID (a claude.ai
#   connector) by these names, and count its calls; a server whose name holds the
#   provider's id (word by word: `claude_ai_Exa`, not `hexagon`) is known by that name.
#   Only names that belong to the provider are listed (`firecrawl_scrape`, not `read_url`).
# unblocker: a reader of the reading ladder's last resort (decision 1.1): after
#   the readers of reading.readers, never on an archive portal or a genealogy database.
# limits: ceilings sent with each call to a provider that takes them (Apify:
#   maxTotalChargeUsd, maxItems, timeout, memory); max_units also caps the units
#   one call may spend, never more than the quota left.
#
# One key, several entries: a platform that counts each of its APIs apart (OpenWeb
# Ninja) gets one entry per API, each with its own free quota, all with the same
# auth.env and the same `platform`. The ledger counts each entry alone; doctor
# checks the key once; quota show lists the entries together:
#   [openwebninja_search]
#   platform = "openwebninja"
#   auth = { header = "x-api-key", env = "OPENWEBNINJA_API_KEY" }
#   free = { amount = 100, period = "monthly" }

