[tavily]
name = "Tavily"
family = "opaque"
kind = "search"
keyword = false
base_url = "https://api.tavily.com/search"
# docs.tavily.com/documentation/api-reference/endpoint, read on 2026-10-14: POST /map
# and POST /crawl, both answered at once (no job to follow)
map_url = "https://api.tavily.com/map"
crawl_url = "https://api.tavily.com/crawl"
# POST /extract gives a page's text: the reading ladder's reader after Firecrawl (T232)
extract_url = "https://api.tavily.com/extract"
auth = { header = "Authorization", scheme = "Bearer", env = "TAVILY_API_KEY" }
unit = "credit"
# docs.tavily.com/documentation/api-credits, read on 2026-10-14:
# - search: basic 1 credit a request, advanced 2;
# - extract (basic): "Every 5 successful URL extractions cost 1 API credit": 0.2 a URL;
#   it gives a page's text, so it is priced as `read` (T232), never as an `extract`;
# - map: "Every 10 successful pages returned cost 1 API credit": 0.1 a URL returned;
# - crawl: "Mapping Cost + Extraction Cost": 0.1 + 0.2 = 0.3 a page (basic, no instructions).
# Failed extractions and failed requests are not billed.
costs = { search = 1, search_advanced = 2, read = 0.2, map = 0.1, crawl = 0.3 }
per_page = ["map", "crawl"]
# github.com/tavily-ai/tavily-mcp, read on 2026-10-14: tavily-search and tavily-extract
# (a hyphen counts as an underscore), a map and a crawl tool; the connectors' names
mcp_tools = { tavily_search = "search", tavily_extract = "read", tavily_map = "map", tavily_crawl = "crawl" }
# the same page: "You get 1,000 free API Credits every month"
free = { amount = 1000, period = "monthly", reset = 1 }
card_required = false
content_reuse = true      # terms §6.5 (May 2026): queries may train its AI models, no opt-out
non_commercial = false
introspection = { method = "endpoint", url = "https://api.tavily.com/usage", fields = ["account.plan_usage", "account.plan_limit"] }
rate = "1/s"
terms_url = "https://tavily.com/terms"
source_url = "https://docs.tavily.com/documentation/api-credits"
checked = 2026-10-23

