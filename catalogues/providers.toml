[zenrows]
name = "ZenRows Universal Scraper API"
family = "opaque"
kind = "read"
unblocker = true          # after the readers of reading.readers; never on an archive portal
keyword = false
base_url = "https://api.zenrows.com/v1/"
auth = { param = "apikey", env = "ZENROWS_API_KEY" }
unit = "credit"
costs = { read = 1, read_js = 5 }   # premium proxy (10, 25 with JS) never used
free = { amount = 5000, period = "monthly", reset = "billing" }   # free plan, not a trial
card_required = false
content_reuse = false
non_commercial = false
billed_errors = [404, 410]          # ZenRows bills a page the target says is gone
introspection = { method = "endpoint", url = "https://api.zenrows.com/v1/subscriptions/self/details", fields = ["credit_limit", "usage_credits", "api_key.caps.0.remaining_credits", "period_starts_at"] }
rate = "5 concurrent"
terms_url = "https://www.zenrows.com/legal/terms"
source_url = "https://docs.zenrows.com/fetch/api-reference"
checked = 2026-10-23

[scraperapi]
name = "ScraperAPI"
family = "opaque"
kind = "read"
unblocker = true          # after the readers of reading.readers; never on an archive portal
keyword = false
base_url = "https://api.scraperapi.com/"
cost_url = "https://api.scraperapi.com/account/urlcost"
auth = { param = "api_key", env = "SCRAPERAPI_API_KEY" }
unit = "credit"
costs = { read = 1, read_js = 10 }  # premium (10, 25 with render) and ultra_premium never used
free = { amount = 1000, period = "monthly", reset = "billing" }   # the 7-day trial of 5,000 is ignored (decision 1.2)
card_required = false
content_reuse = false
non_commercial = false
billed_errors = [404]               # ScraperAPI bills 200 and 404 answers only
introspection = { method = "endpoint", url = "https://api.scraperapi.com/account", fields = ["requestCount", "requestLimit"] }
rate = "5 concurrent"
terms_url = "https://www.scraperapi.com/terms/"
source_url = "https://docs.scraperapi.com/getting-started/quick-start/credits-and-requests-costs"
checked = 2026-10-23

# Apify: only the actors listed in `actors`, never one that targets an archive
# portal or a genealogy database, never a residential proxy. Each run carries the
# ceilings of `limits`; its real cost (usageTotalUsd) is what is counted.

[apify]
name = "Apify (Google Search Scraper)"
platform = "apify"
family = "G"
kind = "search"
keyword = true
base_url = "https://api.apify.com/v2/acts/"
auth = { header = "Authorization", scheme = "Bearer", env = "APIFY_TOKEN" }
unit = "dollar"
costs = { search = 0.00455 }   # a results page (0.0045 $, free tier) and the start (0.00005 $ per GB), since 2026-10-07
free = { amount = 5.0, period = "monthly", reset = "billing", note = "platform credit, no carry-over" }
actors = { search = ["apify~google-search-scraper"] }
limits = { timeout = 120, memory = 1024, max_units = 0.5 }   # Apify refuses a run capped below 0.50 $
card_required = false
content_reuse = false
non_commercial = false
introspection = { method = "endpoint", url = "https://api.apify.com/v2/users/me/limits", fields = ["data.current.monthlyUsageUsd", "data.limits.maxMonthlyUsageUsd", "data.monthlyUsageCycle.startAt"] }
rate = "60/s"
terms_url = "https://docs.apify.com/legal/general-terms-and-conditions"
source_url = "https://apify.com/pricing"
checked = 2026-10-23

