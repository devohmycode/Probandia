# sent, the pages and the outputs may be used for "model training, model fine-tuning".
content_reuse = true
non_commercial = false
# GET /api/credits costs no credits (docs.scrapegraphai.com/api-reference/endpoint/credits)
introspection = { method = "endpoint", url = "https://v2-api.scrapegraphai.com/api/credits", fields = ["remaining", "used", "plan"] }
rate = "10/min"
terms_url = "https://scrapegraphai.com/terms"
source_url = "https://docs.scrapegraphai.com/knowledge-base/account/pricing"
