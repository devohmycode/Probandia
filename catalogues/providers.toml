# Page reading (and search)

[jina]
name = "Jina Reader"
family = "opaque"
kind = "read"
keyword = false
base_url = "https://r.jina.ai/"
search_url = "https://s.jina.ai/"
auth = { header = "Authorization", scheme = "Bearer", env = "JINA_API_KEY" }
key_optional = true       # works without a key, at a low rate
unit = "token"
# jina.ai/reader, read on 2026-10-14: a read is charged "based on content length" (the
# tokens of the answer, which the adapter counts); a search costs "a fixed number of
# tokens, starting from 10,000 tokens". 3,000 is only the estimate made before a read.
costs = { read = 3000, search = 10000 }
# the same page: "Every new API key comes with 10M free tokens!"; it names no monthly
# renewal (more tokens are bought once they are used): a one-time grant per key.
free = { amount = 10000000, period = "once" }
card_required = false
content_reuse = false
# the CC BY-NC 4.0 licence the same page names covers the model weights (ReaderLM-v2,
# jina-vlm), not the use of the API; jina.ai/legal could not be read (scripted page):
# jina.ai/legal (May 2026), read on 2026-10-23: §10.4, request data never used to train; §4.3, no
# restriction on the output; the non-commercial licence covers the model weights only.
non_commercial = false
introspection = { method = "none" }
rate = "20/min"
terms_url = "https://jina.ai/legal"
source_url = "https://jina.ai/reader"
checked = 2026-10-23

[firecrawl]
name = "Firecrawl"
family = "opaque"
kind = "read"
keyword = false
base_url = "https://api.firecrawl.dev/v2/scrape"
search_url = "https://api.firecrawl.dev/v2/search"
# docs.firecrawl.dev/api-reference/endpoint, read on 2026-10-14: POST /v2/map; POST
# /v2/crawl starts a job, GET /v2/crawl/{id} reads it, DELETE cancels it; the
# extraction is the JSON format of /v2/scrape
map_url = "https://api.firecrawl.dev/v2/map"
crawl_url = "https://api.firecrawl.dev/v2/crawl"
extract_url = "https://api.firecrawl.dev/v2/scrape"
auth = { header = "Authorization", scheme = "Bearer", env = "FIRECRAWL_API_KEY" }
unit = "credit"
# docs.firecrawl.dev/billing, read on 2026-10-14:
# - scrape "1 credit / page"; search "2 credits / 10 results";
# - map "1 credit / call" (www.firecrawl.dev/pricing writes "1 / page": the call is
#   what the billing page bills, one call returns the whole list);
# - crawl "1 credit / page";
# - JSON format (LLM extraction) "+4 credits per page" on top of the scrape: 5 a page.
#   The extraction of the engine is that JSON format of /v2/scrape, not /v2/extract.
costs = { read = 1, search = 2, map = 1, crawl = 1, extract = 5 }
per_page = ["crawl"]
# github.com/firecrawl/firecrawl-mcp-server, read on 2026-10-14 (firecrawl_extract and
# firecrawl_batch_scrape: earlier versions); its other tools get what their name says
mcp_tools = { firecrawl_scrape = "read", firecrawl_batch_scrape = "read", firecrawl_parse = "read", firecrawl_search = "search", firecrawl_map = "map", firecrawl_crawl = "crawl", firecrawl_extract = "extract" }
# docs.firecrawl.dev/billing and www.firecrawl.dev/pricing, 2026-10-14: 1,000 credits a
# month, "The allotment resets at the start of each monthly cycle", no rollover,
# "no credit card required".
free = { amount = 1000, period = "monthly", reset = "billing" }
card_required = false
content_reuse = false
non_commercial = false
introspection = { method = "endpoint", url = "https://api.firecrawl.dev/v2/team/credit-usage", fields = ["data.remainingCredits", "data.planCredits", "data.billingPeriodStart", "data.billingPeriodEnd"] }
rate = "10/min"              # free plan: 10/min scrape, map, search; 2/min crawl
terms_url = "https://www.firecrawl.dev/terms-of-service"
source_url = "https://docs.firecrawl.dev/billing"
checked = 2026-10-23

# Structured extraction (read --extract): a page turned into JSON after an
