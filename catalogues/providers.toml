kind = "search"
keyword = false
base_url = "https://api.exa.ai/search"
auth = { header = "x-api-key", env = "EXA_API_KEY" }
unit = "dollar"
# exa.ai/pricing, read on 2026-10-14: search fast or auto $7 per 1,000 requests (up to
# 10 results), highlights $1 per 1,000 pages; the adapter asks highlights for each
# result: 0.007 + 10 × 0.001. What Exa reports (costDollars.total) is what is counted.
# exa.ai/pricing, read on 2026-10-20: the same, and type deep $12 per 1,000 requests
# (search --depth advanced): 0.012 + 10 × 0.001.
costs = { search = 0.017, search_advanced = 0.022 }
# github.com/exa-labs/exa-mcp-server, read on 2026-10-14: web_fetch_exa (crawling_exa
# in earlier versions) reads pages
mcp_tools = { web_search_exa = "search", web_search_advanced_exa = "search", web_fetch_exa = "read", crawling_exa = "read" }
# exa.ai/pricing, 2026-10-14: "The Free Tier gives you $10 in credits", the balance
# "resets to $10 on the first of every month", no payment method required; the
# one-time $10 bonus after onboarding is left out (counted only once Exa reports it).
free = { amount = 10, period = "monthly", reset = 1, note = "a one-time $10 bonus after onboarding is not counted" }
card_required = false
content_reuse = true      # terms §1.2(c): a licence on user input and output to improve its products
non_commercial = false
introspection = { method = "response", fields = ["costDollars.total"] }
rate = "10/s"                # deep types: 5/s
terms_url = "https://exa.ai/terms"
source_url = "https://exa.ai/pricing"
