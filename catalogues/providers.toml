costs = { extract = 5 }
# github.com/ScrapeGraphAI/scrapegraph-mcp, read on 2026-10-14: its tools now have
# common names (scrape, extract, search, crawl_start…), known by the server's name only,
# and all of them extract (the entry's kind); the names of earlier versions are its own
mcp_tools = { smartscraper = "extract", searchscraper = "extract", markdownify = "extract", smartcrawler_initiate = "extract", agentic_scrapper = "extract" }
# the two official pages disagree: the pricing page says "500 API credits, one-time",
# the documentation "500 API credits / month". To confirm on an account: the one-time
# grant is kept, the one that can never be overspent.
free = { amount = 500, period = "once", note = "one-time on the pricing page, monthly in the documentation (2026-10-23): the smaller kept" }
card_required = false     # not stated on the pricing page (2026-10-23)
