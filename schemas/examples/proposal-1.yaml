  - id: s-01J9ZM0000000000000000000C
    ts: '2026-09-30T10:00:00Z'
    kind: archive
    engine: openarchives
    query: "MARCHAND mariage Hautbois"
    variants: [MARCHAND, MARCHANT, MARCHAN]
    window: {from: 1845, to: 1855, places: [Hautbois]}
    filters: {register: "Hautbois, mariages 1845-1855", views: "4-24"}   # what was read, view by view
    result: negative
