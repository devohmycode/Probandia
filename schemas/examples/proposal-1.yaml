    type: birth
    date: {value: '1851-03-12', qualifier: exact, original: "12 mars 1851"}   # quote any text holding : [ ] { } #
    place: {id: hautbois, as_written: "Hautbois (Holtzbach)"}             # null, or {id, as_written}: id null if not in places
    status: record      # record: read on the image; index: an index or another's transcription; hypothesis, refuted
    source: src-01J9ZM0000000000000000000B
    excerpt: {source: src-01J9ZM0000000000000000000B, lines: 4-5}         # lines of its transcription: propose copies them
