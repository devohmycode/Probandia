  - id: src-01J9ZM0000000000000000000B
    type: civil-registration
    repository: Archives communales de Hautbois
    collection: "État civil, Hautbois, naissances 1851"
    act_no: "12"
    act_date: '1851-03-13'
    image: evidence/hautbois-1851-12.jpg
    transcription: evidence/transcriptions/src-01J9ZM0000000000000000000B.md
